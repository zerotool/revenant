# Private tmux server behind Ghostty tabs (started by ./attach on its own socket, so it never meets your
# ~/.tmux.conf or your other tmux sessions). It stays invisible: no status bar, no prefix key. Its only
# job is to keep tab processes alive when Ghostty dies.
set -g prefix None
set -g status off
set -g default-terminal tmux-256color
set -g history-limit 50000
set -s escape-time 0
set -g mouse on

# Let terminal escapes through, so notifications, focus events, Shift+Enter and true color reach the
# programs inside, AI coding agents such as Claude Code included (code.claude.com/docs/en/terminal-config).
set -g allow-passthrough on
set -g focus-events on
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys:RGB:sync:hyperlinks:usstyle:strikethrough:overline'

set -s set-clipboard on
set -g set-titles on
set -g set-titles-string '#{pane_title}'
set -g bell-action any
set -g visual-bell off
set-environment -g REVENANT 1

# Scrolling back with the wheel enters copy mode; any key leaves it, so typing never gets swallowed.
set -g mode-keys emacs
unbind -T copy-mode -a
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 3 scroll-down-and-cancel
bind -T copy-mode MouseDown1Pane select-pane
bind -T copy-mode MouseDrag1Pane select-pane \; send-keys -X begin-selection
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-and-cancel
bind -T copy-mode PPage send-keys -X page-up
bind -T copy-mode NPage send-keys -X page-down
bind -T copy-mode Any send-keys -X cancel

# $REVENANT_LIBEXEC comes from ./attach and is expanded once, when the server starts.
set-hook -g client-detached "run-shell -b '\"$REVENANT_LIBEXEC/reap\" \"#{socket_path}\"'"
